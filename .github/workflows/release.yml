name: Release

# Build Haze and publish a GitHub Release with three assets:
#   - Haze.dmg       drag-install for first-time users
#   - Haze.zip       the Sparkle update archive
#   - appcast.xml    the signed Sparkle feed
#
# The app's SUFeedURL is https://github.com/adrbn/haze/releases/latest/download/appcast.xml,
# so installed copies see the new version, show the changelog, and self-update
# in place ("Check for Updates…" or automatically once a day).
#
# Versioning: MARKETING_VERSION comes from the tag (v0.1.0 -> 0.1.0) and
# CFBundleVersion from the commit count (monotonic), so Sparkle always sees a
# higher build number than what's installed.
#
# Requires repo secret SPARKLE_ED_PRIVATE_KEY — the EdDSA private key whose
# public half is SUPublicEDKey in Info.plist. That signature is what authenticates
# the *contents* of an update.
#
# It is NOT sufficient on its own: Sparkle also refuses to install an update whose
# code signature does not match the installed app's, and an ad-hoc binary's
# designated requirement is its own cdhash — different on every build. So an
# ad-hoc release can never self-update (verified on-device; the same update
# installs when both copies carry the same Developer ID). Sign releases with the
# Developer ID below or auto-update is dead on arrival, Gatekeeper aside.
#
# Apple signing is OPTIONAL and detected at run time. Set all five secrets below
# and the build is signed with the Developer ID certificate, notarized and
# stapled, so a first install from the DMG opens with no Gatekeeper warning.
# Leave any of them unset and the job falls back to the ad-hoc build it always
# did (first install then needs right-click -> Open, or `xattr -cr`).
#
#   MACOS_CERTIFICATE          base64 of the Developer ID .p12
#                              (`base64 -i cert.p12 | pbcopy`)
#   MACOS_CERTIFICATE_PWD      the password set when exporting that .p12
#   MACOS_SIGN_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID              the 10-character team identifier
#   NOTARY_KEY / NOTARY_KEY_ID / NOTARY_ISSUER_ID
#                              App Store Connect API key (.p8 contents, key id,
#                              issuer uuid) — preferred over an Apple ID password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SPARKLE_TOOLS_VERSION: "2.9.3"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history -> commit-count build number + changelog

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain -quiet || true

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SHORT="${GITHUB_REF_NAME#v}"
          else
            SHORT="0.0.0"
          fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Haze $SHORT (build $(git rev-list --count HEAD))"

      - name: Generate project
        run: xcodegen generate

      # Apple signing is all-or-nothing: without every secret we build ad-hoc
      # exactly as before, so the workflow keeps working un-configured.
      - name: Decide signing mode
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [[ -n "$CERT" && -n "$CERT_PWD" && -n "$IDENTITY" && -n "$TEAM" && -n "$NOTARY_KEY" ]]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "Signing with Developer ID + notarization"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets absent — ad-hoc build (Gatekeeper warning on first install)"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.apple == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          # Throwaway keychain, unlocked only for this job.
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          echo "$CERT" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain >/dev/null
          security find-identity -v -p codesigning build.keychain

      - name: Build (Release)
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [[ "${{ steps.signing.outputs.apple }}" == "true" ]]; then
            SIGN_ARGS=(HAZE_CODE_SIGN_IDENTITY="$IDENTITY" HAZE_DEVELOPMENT_TEAM="$TEAM"
                       OTHER_CODE_SIGN_FLAGS="--timestamp" CODE_SIGNING_REQUIRED=YES)
          else
            SIGN_ARGS=(HAZE_CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild -project Haze.xcodeproj -scheme Haze \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.short }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=YES "${SIGN_ARGS[@]}" \
            build

      # Notarize the .app itself and staple the ticket into the bundle, before
      # it is copied into the DMG and the Sparkle zip — so both carry it.
      - name: Notarize and staple
        if: steps.signing.outputs.apple == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Haze.app"
          printf '%s' "$NOTARY_KEY" > notary.p8
          ditto -c -k --sequesterRsrc --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm -f notary.p8 notarize.zip
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package DMG
        run: |
          APP="build/Build/Products/Release/Haze.app"
          if [[ "${{ steps.signing.outputs.apple }}" != "true" ]]; then
            codesign --force --deep --sign - "$APP"
          fi
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Haze" -srcfolder "$STAGE" -ov -format UDZO Haze.dmg
          echo "Built $(du -h Haze.dmg | cut -f1) DMG"

      - name: Build Sparkle zip + signed appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Haze.app"
          TAG="${GITHUB_REF_NAME}"

          # Sparkle-friendly zip (preserves symlinks + resource forks).
          ditto -c -k --sequesterRsrc --keepParent "$APP" Haze.zip

          # Sparkle CLI tools (pinned).
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          mkdir -p sparkle && tar -xJf sparkle.tar.xz -C sparkle

          # Changelog: commit subjects since the previous tag.
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}${TAG}"
          git log --no-merges --pretty='%s' $RANGE > notes.txt || true

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > ed_private_key
          python3 scripts/make_appcast.py \
            --sign-update sparkle/bin/sign_update \
            --key-file ed_private_key \
            --zip Haze.zip \
            --short "${{ steps.ver.outputs.short }}" \
            --build "${{ steps.ver.outputs.build }}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Haze.zip" \
            --pubdate "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
            --notes-file notes.txt \
            --out appcast.xml
          rm -f ed_private_key
          echo "=== appcast.xml ===" && cat appcast.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haze-dmg
          path: Haze.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Haze.dmg
            Haze.zip
            appcast.xml
          generate_release_notes: true
